<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FinSight</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: 36px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .demo-box {
      background: var(--primary-light);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-logo" style="justify-content:center; margin-bottom:12px;">
        <div class="brand-icon">F</div>
        <div class="brand-name" style="color:var(--secondary)">Fin<span>Sight</span></div>
      </div>
      <h2 style="font-size:1.4rem; color:var(--secondary); font-weight:700;">Welcome Back</h2>
      <p style="color:var(--text-muted); font-size:0.88rem; margin-top:4px;">Sign in to your wholesale financial portal</p>
    </div>

    <div class="demo-box">
      <div>
        <div style="font-weight:700; color:var(--primary)">Quick Demo Access</div>
        <div style="color:var(--text-muted)">admin@finsight.pk • admin123</div>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="btn-fill-demo">Fill Demo</button>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="name@company.pk" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:8px;">
        Sign In to FinSight
      </button>
    </form>

    <div style="text-align:center; margin-top:24px; font-size:0.85rem; color:var(--text-muted);">
      Don't have an account? <a href="register.html" style="font-weight:600;">Register your business</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('btn-fill-demo').addEventListener('click', () => {
      document.getElementById('login-email').value = 'admin@finsight.pk';
      document.getElementById('login-password').value = 'admin123';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await Api.post('/auth/login', { email, password });
        Api.setToken(res.access_token);
        Api.setUser(res.user, res.business_name);
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
